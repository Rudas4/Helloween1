<!doctype html>
<html lang="hu">
<head>

  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-1F19F024P1"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Nyomozás - Puzzle játék</title>
  <style>
    :root{
      --cell-w: 200px;
      --cell-h: 150px;
      --light-radius: 320px;
      --soft-edge: 80px;
    }
    
    * {
      box-sizing: border-box;
    }
    
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: system-ui, Segoe UI, Roboto, Helvetica, Arial;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: manipulation;
    }
    
    #start {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #000;
      z-index: 10;
      overflow: hidden;
    }
    
    #start::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('kezdes.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: -1;
    }
    
    #start .center {
      background: rgba(0, 0, 0, 0.4); /* Átlátszóbb háttér */
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.2);
      max-width: 90%;
      box-sizing: border-box;
      z-index: 1;
      backdrop-filter: blur(5px); /* Modern blur effect */
      -webkit-backdrop-filter: blur(5px);
    }
    
    #start h1 {
      color: #fff;
      margin: 0 0 20px;
      font-size: 32px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
    }
    
    #start button {
      background: rgba(255, 255, 255, 0.9);
      color: #000;
      border: 0;
      padding: 16px 32px;
      border-radius: 8px;
      font-size: 20px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      max-width: 200px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }
    
    #start button:hover {
      background: rgba(255, 255, 255, 1);
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
    }

    #game {
      display: none;
      padding: 10px;
      box-sizing: border-box;
      background: #000;
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
      overflow: auto;
      height: 100vh;
    }
    
    .layout {
      display: flex;
      gap: 15px;
      justify-content: center;
      align-items: flex-start;
      margin: 0 auto;
      width: 100%;
      max-width: 100%;
      flex-wrap: wrap;
    }
    
    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-auto-rows: 1fr;
      gap: 6px;
      padding: 12px;
      background: #111;
      border-radius: 8px;
      box-shadow: 0 8px 25px rgba(255,255,255,0.1);
      border: 1px solid #333;
      width: 100%;
      max-width: calc(var(--cell-w) * 3 + 12px + 24px);
      aspect-ratio: 3/2;
    }
    
    .cell {
      width: 100%;
      height: 100%;
      border: 2px dashed #444;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      background: #000;
    }

    .pool {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      background: linear-gradient(180deg, #111, #0a0a0a);
      box-shadow: 0 8px 25px rgba(255,255,255,0.05);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-content: flex-start;
      justify-content: center;
      border: 1px solid #333;
      max-height: 500px;
      overflow-y: auto;
      min-width: 250px;
      max-width: 100%;
    }
    
    .piece {
      width: 100%;
      height: 100%;
      object-fit: contain;
      cursor: grab;
      border-radius: 6px;
      user-select: none;
      background-color: #222;
      touch-action: none;
    }
    
    .piece:active {
      cursor: grabbing;
    }
    
    .cell .piece {
      object-fit: cover;
      background-color: #000;
    }

    /* Befejező képernyő - teljes képernyős, arányos háttérrel */
    #end {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      cursor: none;
    }

    .end-image-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .end-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Mobil esetén - ha a kép túl nagy, akkor cover mód */
    @media (max-height: 600px) {
      .end-image {
        object-fit: cover;
      }
    }

    .dark-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      background: radial-gradient(
        circle var(--light-radius) at var(--mx, 50%) var(--my, 50%),
        rgba(0,0,0,0) 0%,
        rgba(0,0,0,0) calc(100% - var(--soft-edge)),
        rgba(0,0,0,1) 100%
      );
      transition: background 0.05s ease-out;
    }

    .flash {
      position: fixed;
      width: calc(var(--light-radius) * 1.3);
      height: calc(var(--light-radius) * 1.3);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      background: radial-gradient(circle,
        rgba(255,255,230,0.9) 0%,
        rgba(255,255,230,0.1) 50%,
        rgba(255,255,230,0) 80%);
      mix-blend-mode: screen;
      filter: blur(4px);
      z-index: 5;
      transition: left 0.05s ease-out, top 0.05s ease-out;
    }

    .instruction {
      text-align: center;
      margin-bottom: 15px;
      color: #fff;
      font-weight: bold;
      font-size: 16px;
      width: 100%;
      line-height: 1.4;
      padding: 0 10px;
      box-sizing: border-box;
    }

    /* Reszponzív design - frissítve mobiloptimalizáláshoz */
    @media (max-width: 900px) {
      :root {
        --cell-w: 180px;
        --cell-h: 135px;
      }
      .pool {
        min-width: 220px;
      }
    }
    
    @media (max-width: 768px) {
      .layout {
        flex-direction: column;
        align-items: center;
        gap: 15px;
      }
      .pool {
        order: 2;
        width: 100%;
        max-width: 650px;
        flex: none;
        max-height: 200px;
        min-width: unset;
      }
      .board {
        order: 1;
        max-width: 100%;
      }
      :root {
        --cell-w: 160px;
        --cell-h: 120px;
      }
      #start .center {
        padding: 25px 15px;
      }
      #start h1 {
        font-size: 28px;
      }
      #start button {
        padding: 14px 28px;
        font-size: 18px;
      }
    }
    
    @media (max-width: 600px) {
      :root {
        --cell-w: 140px;
        --cell-h: 105px;
        --light-radius: 240px;
        --soft-edge: 60px;
      }
      .instruction {
        font-size: 14px;
        padding: 0 10px;
      }
      .board {
        aspect-ratio: 3/2;
        max-width: calc(var(--cell-w) * 3 + 12px + 24px);
      }
      #start .center {
        padding: 20px 15px;
        background: rgba(0, 0, 0, 0.3); /* Még átlátszóbb mobilon */
      }
      #start h1 {
        font-size: 24px;
        margin-bottom: 15px;
      }
    }
    
    @media (max-width: 480px) {
      :root {
        --cell-w: 110px;
        --cell-h: 82px;
        --light-radius: 200px;
        --soft-edge: 50px;
      }
      .pool {
        max-height: 150px;
      }
      #game {
        padding: 5px;
      }
      .board {
        max-width: calc(var(--cell-w) * 3 + 12px + 24px);
      }
      #start .center {
        padding: 15px 10px;
      }
      #start h1 {
        font-size: 22px;
      }
      #start button {
        padding: 12px 24px;
        font-size: 16px;
      }
    }
    
    @media (max-width: 360px) {
      :root {
        --cell-w: 95px;
        --cell-h: 71px;
      }
      .board {
        max-width: calc(var(--cell-w) * 3 + 12px + 24px);
      }
      #start h1 {
        font-size: 20px;
      }
      #start button {
        padding: 10px 20px;
      }
    }

    /* Extra kis képernyők - itt minimalizáljuk a tartalmat */
    @media (max-height: 500px) {
      #start .center {
        padding: 10px;
        max-width: 80%;
      }
      #start h1 {
        font-size: 18px;
        margin-bottom: 10px;
      }
      #start button {
        padding: 8px 16px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <section id="start">
    <div class="center">
      
      <button id="startBtn">Kezdés</button>
    </div>
  </section>

  <main id="game">
    <div class="instruction">Helyezd a puzzle-darabokat a megfelelő helyre!
A feladatod azonban nem ér véget a puzzle kirakásával. Keresgélj figyelmesen a következő oldalon!</div>
    <div class="layout">
      <div class="board" id="board">
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
        <div class="cell" data-index="9"></div>
      </div>
      <aside class="pool" id="pool"></aside>
    </div>
  </main>

  <section id="end">
    <div class="end-image-container">
      <img class="end-image" src="befejezo.png" alt="Befejező kép" />
    </div>
    <div class="dark-overlay" id="overlay"></div>
    <div class="flash" id="flash"></div>
  </section>

  <script>
    const PIECES = ['jatek1','jatek2','jatek3','jatek4','jatek5','jatek6','jatek7','jatek8','jatek9'];

    const startBtn = document.getElementById('startBtn');
    const startSection = document.getElementById('start');
    const game = document.getElementById('game');
    const pool = document.getElementById('pool');
    const board = document.getElementById('board');
    const end = document.getElementById('end');
    const overlay = document.getElementById("overlay");
    const flash = document.getElementById("flash");

    // Képek előzetes betöltése a gyorsabb működés érdekében
    function preloadImages() {
      const images = [];
      
      // Kezdő kép
      const startImg = new Image();
      startImg.src = 'kezdes.png';
      images.push(startImg);
      
      // Befejező kép
      const endImg = new Image();
      endImg.src = 'befejezo.png';
      images.push(endImg);
      
      // Puzzle darabok
      for(const piece of PIECES) {
        const img = new Image();
        img.src = piece + '.png';
        images.push(img);
      }
      
      return images;
    }

    function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

    function createDraggableImage(name, isInCell = false){
      const img = document.createElement('img');
      img.src = name + '.png';
      img.alt = name;
      img.className = 'piece';
      img.draggable = true;
      img.dataset.name = name;
      
      if(isInCell) {
        img.style.objectFit = 'cover';
      } else {
        img.style.objectFit = 'contain';
        img.style.maxWidth = '110px';
        img.style.maxHeight = '90px';
      }
      
      img.addEventListener('dragstart', onDragStart);
      img.addEventListener('dragend', onDragEnd);
      
      // Touch események hozzáadása
      img.addEventListener('touchstart', onTouchStart, {passive: false});
      img.addEventListener('touchmove', onTouchMove, {passive: false});
      img.addEventListener('touchend', onTouchEnd);
      
      return img;
    }

    function populatePool(){
      pool.innerHTML='';
      const shuffled = shuffle([...PIECES]);
      for(const name of shuffled){
        const img = createDraggableImage(name, false);
        pool.appendChild(img);
      }
    }

    let dragged = null;
    let touchOffsetX = 0;
    let touchOffsetY = 0;
    
    function onDragStart(e){ 
      dragged = e.target; 
      e.dataTransfer.setData('text/plain', e.target.dataset.name); 
      setTimeout(()=>{ e.target.style.opacity='0.6'},0) 
    }
    
    function onDragEnd(e){ 
      if(e.target) e.target.style.opacity='1'; 
      dragged=null;
    }
    
    // Touch események kezelése
    function onTouchStart(e) {
      e.preventDefault();
      dragged = e.target;
      const touch = e.touches[0];
      const rect = dragged.getBoundingClientRect();
      touchOffsetX = touch.clientX - rect.left;
      touchOffsetY = touch.clientY - rect.top;
      
      dragged.style.opacity = '0.6';
      dragged.style.position = 'fixed';
      dragged.style.zIndex = '1000';
      dragged.style.pointerEvents = 'none';
      
      updateTouchPosition(e);
    }
    
    function onTouchMove(e) {
      if (!dragged) return;
      e.preventDefault();
      updateTouchPosition(e);
    }
    
    function onTouchEnd(e) {
      if (!dragged) return;
      
      dragged.style.opacity = '1';
      dragged.style.position = '';
      dragged.style.zIndex = '';
      dragged.style.pointerEvents = '';
      
      const touch = e.changedTouches[0];
      const dropTarget = document.elementFromPoint(touch.clientX, touch.clientY);
      
      if (dropTarget && dropTarget.classList.contains('cell')) {
        handleDrop(dropTarget, dragged.dataset.name);
      } else if (dropTarget && dropTarget.classList.contains('pool')) {
        handlePoolDrop(dragged.dataset.name);
      }
      
      dragged = null;
    }
    
    function updateTouchPosition(e) {
      if (!dragged) return;
      const touch = e.touches[0];
      dragged.style.left = (touch.clientX - touchOffsetX) + 'px';
      dragged.style.top = (touch.clientY - touchOffsetY) + 'px';
    }

    const cells = Array.from(document.querySelectorAll('.cell'));
    cells.forEach(cell => {
      cell.addEventListener('dragover', e => e.preventDefault());
      cell.addEventListener('drop', onDrop);
    });

    pool.addEventListener('dragover', e => e.preventDefault());
    pool.addEventListener('drop', e => {
      e.preventDefault();
      const name = e.dataTransfer.getData('text/plain');
      handlePoolDrop(name);
    });

    function onDrop(e){
      e.preventDefault();
      const name = e.dataTransfer.getData('text/plain');
      handleDrop(e.currentTarget, name);
    }
    
    function handleDrop(targetCell, name) {
      const fromCell = findCellContaining(name);
      
      const fromPool = findInPool(name);
      if(fromPool) {
        fromPool.remove();
      }
      
      if(fromCell){fromCell.innerHTML='';}
      const existingImg = targetCell.querySelector('img');
      if(existingImg){
        const prevName = existingImg.dataset.name;
        existingImg.remove();
        const prevImg = createDraggableImage(prevName, false);
        pool.appendChild(prevImg);
      }
      const img = createDraggableImage(name, true);
      targetCell.innerHTML='';
      targetCell.appendChild(img);
      checkWin();
    }
    
    function handlePoolDrop(name) {
      const fromCell = findCellContaining(name);
      if(fromCell){fromCell.innerHTML='';}
      const img = createDraggableImage(name, false);
      pool.appendChild(img);
      checkWin();
    }

    function findCellContaining(name){
      return cells.find(c => c.querySelector('img') && c.querySelector('img').alt === name) || null;
    }
    
    function findInPool(name){
      const poolImages = Array.from(pool.querySelectorAll('img'));
      return poolImages.find(img => img.alt === name) || null;
    }

    function checkWin(){
      let correct = true;
      for(let i=0;i<cells.length;i++){
        const img = cells[i].querySelector('img');
        if(!img || img.alt !== PIECES[i]){correct=false;break;}
      }
      if(correct){showEndPage();}
    }

    function moveLight(x, y) {
      const mx = (x / window.innerWidth) * 100;
      const my = (y / window.innerHeight) * 100;

      overlay.style.setProperty("--mx", mx + "%");
      overlay.style.setProperty("--my", my + "%");

      flash.style.left = x + "px";
      flash.style.top = y + "px";
    }

    function showEndPage(){
      startSection.style.display='none';
      game.style.display='none';
      end.style.display='block';
      
      moveLight(window.innerWidth / 2, window.innerHeight / 2);
      
      document.addEventListener("mousemove", (e) => {
        moveLight(e.clientX, e.clientY);
      });

      document.addEventListener("touchmove", (e) => {
        if (e.touches.length) {
          moveLight(e.touches[0].clientX, e.touches[0].clientY);
          e.preventDefault();
        }
      });
    }

    // Képek előzetes betöltése az oldal betöltésekor
    window.addEventListener('load', () => {
      preloadImages();
    });

    startBtn.addEventListener('click', ()=>{
      startSection.style.display='none';
      game.style.display='block';
      populatePool();
    });

    document.addEventListener('DOMContentLoaded', ()=>{
      end.style.display='none';
      game.style.display='none';
    });
  </script>
</body>
</html>
